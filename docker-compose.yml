services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
      POSTGRES_DB: supportflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data           # data survives `docker compose down` / restarts
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Local S3 for development (LocalStack emulates the AWS S3 API).
  # The backend talks to it with boto3 exactly as it would to AWS; only S3_ENDPOINT_URL differs.
  # Note: the free LocalStack keeps objects in memory, so files are gone after the container restarts.
  s3:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./docker/s3-init.sh:/etc/localstack/init/ready.d/s3-init.sh:ro   # creates buckets + CORS
    healthcheck:
      # healthy = S3 is up AND the init script (buckets, CORS) has finished
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
